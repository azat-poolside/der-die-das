[project]
name = "der-die-das"
version = "0.1.0"
description = "A web-based spaced repetition app for learning German articles (der, die, das)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "asyncpg",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.4.0",
    "pre-commit>=3.0.0",
    "black>=24.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Comprehensive rules for Python 3.11+, FastAPI, and best practices
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # type-checking mode
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code detection)
    "PD",     # pandas-vet (useful even without pandas)
    "PL",     # pylint
    "TRY",    # tryceratops (better exception handling)
    "DOC",    # pydoclint
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "DOC501", # pydocstyle: Missing argument description
    "DOC201", # pydocstyle: Missing Return section
]

# Allow autofix for all enabled rules (when `--fix` is used)
fixable = ["ALL"]
unfixable = []

# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "alembic",
    "migrations",
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?$))"

[tool.ruff.lint.per-file-ignores]
# Tests can use assertions and magic values
"tests/**" = ["S101", "PLR2004", "ARG001"]
"test_*.py" = ["S101", "PLR2004", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["database", "models", "schema", "crud", "main", "api", "core", "utils"]
known-third-party = ["fastapi", "sqlalchemy", "pydantic", "asyncpg"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 88
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_no_return = true
strict_equality = true
strict_concatenation = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
pretty = true
show_traceback = true
show_column_codes = true
show_error_context = true
show_absolute_path = false
color_output = true
error_summary = true
incremental = true
cache_dir = ".mypy_cache"

# FastAPI and Pydantic specific settings
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true

# Exclude common directories
exclude = ["alembic/", "migrations/", ".venv/"]

# Per-module overrides for common FastAPI patterns
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "test_.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ============================================================================
# Black Configuration - Code formatting
# ============================================================================
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | alembic
    | migrations
)/
'''

# ============================================================================
# isort Configuration - Import sorting
# ============================================================================
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["database", "models", "schema", "crud", "main", "api", "core", "utils"]
known_third_party = ["fastapi", "sqlalchemy", "pydantic", "asyncpg"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_after_imports = 2